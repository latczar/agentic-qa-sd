name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sd_user
          POSTGRES_PASSWORD: sd_password
          POSTGRES_DB: service_desk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sd_user -d service_desk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      rabbitmq:
        image: rabbitmq:3-management
        env:
          RABBITMQ_DEFAULT_USER: sd_user
          RABBITMQ_DEFAULT_PASS: sd_password
        ports:
          - 5672:5672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql+psycopg://sd_user:sd_password@localhost:5432/service_desk
      TEST_DATABASE_URL: postgresql+psycopg://sd_user:sd_password@localhost:5432/service_desk_test
      RABBITMQ_URL: amqp://sd_user:sd_password@localhost:5672/
      # There is no Ollama in CI, and there shouldn't be. Every test builds its
      # own provider explicitly; this is belt and braces so a future test that
      # calls get_embedding_provider() fails fast rather than hanging on a
      # connection to nothing.
      EMBEDDING_PROVIDER: fake

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install API dependencies
        working-directory: api
        run: pip install -r requirements.txt

      - name: Verify Alembic migrations (upgrade, downgrade, upgrade again)
        working-directory: api
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Run API tests
        working-directory: api
        run: pytest -v

      - name: Install worker dependencies
        working-directory: worker
        run: pip install -r requirements.txt

      - name: Run worker tests
        working-directory: worker
        run: pytest -v
