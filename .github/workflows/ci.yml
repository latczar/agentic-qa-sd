name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api-tests:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: sd_user
          POSTGRES_PASSWORD: sd_password
          POSTGRES_DB: service_desk
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sd_user -d service_desk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        working-directory: api
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: api
        env:
          DATABASE_URL: postgresql+psycopg://sd_user:sd_password@localhost:5432/service_desk
          TEST_DATABASE_URL: postgresql+psycopg://sd_user:sd_password@localhost:5432/service_desk_test
        run: pytest -v
